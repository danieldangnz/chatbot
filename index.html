<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Bootstrap Chat Widget</title>
  <!--Bootstrap CSS-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!--Bootstrap JS-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
 

  <style>

  .chat-widget{
      position:fixed;
      bottom:20px;
      right:20px;
      z-index:9999;
  }

  /* Floating Button */
  .chat-toggle{
      width:60px;
      height:60px;
      border-radius:50%;
      border:none;
      box-shadow:0 5px 15px rgba(0,0,0,.25);
  }

  /* Chat Window */
  .chat-window{
      width:380px;
      height:550px;
      position:absolute;
      bottom:75px;
      right:0;
      display:none;
  }

  .chat-window.show{
      display:block;
  }

  .card-chat{
      height:100%;
  }

  .chat-body{
      flex:1;
      overflow-y:auto;
      background:#f8f9fa;
      padding:15px;
  }

  .message{
      margin-bottom:15px;
  }

  .message-user{
      text-align:right;
  }

  .bubble{
      display:inline-block;
      padding:10px 14px;
      border-radius:15px;
      max-width:80%;
  }

  .bot .bubble{
      background:#e9ecef;
  }

  .user .bubble{
      background:#0d6efd;
      color:white;
  }

  .timestamp{
      font-size:.75rem;
      color:#6c757d;
      margin-top:4px;
  }

  /* Typing indicator */
  .typing{
      display:none;
  }

  .typing.active{
      display:flex;
      align-items:center;
      gap:4px;
      padding:10px;
  }

  .typing span{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#6c757d;
      animation:bounce 1s infinite;
  }

  .typing span:nth-child(2){
      animation-delay:.2s;
  }

  .typing span:nth-child(3){
      animation-delay:.4s;
  }

  @keyframes bounce{
      0%,100%{
          transform:translateY(0);
      }
      50%{
          transform:translateY(-5px);
      }
  }

  /* Dark Mode */

  .dark-mode{
      background:#212529;
  }

  .dark-mode .card{
      background:#2c3034;
      color:white;
  }

  .dark-mode .chat-body{
      background:#343a40;
  }

  .dark-mode .bot .bubble{
      background:#495057;
      color:white;
  }

  .dark-mode .form-control{
      background:#495057;
      border-color:#6c757d;
      color:white;
  }

  .dark-mode .timestamp{
      color:#ced4da;
  }

  @media(max-width:576px){

      .chat-window{
          width:95vw;
          right:0;
      }

  }

  </style>
</head>

<body>

  <div class="chat-widget">
      <!-- Floating Button -->
      <button class="btn btn-primary chat-toggle" id="chatToggle">💬</button>

      <!-- Chat Window -->
      <div class="chat-window" id="chatWindow">
          <div class="card shadow card-chat">
              <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                  <div>
                      <strong>Support Assistant</strong><br>
                      <small>Online</small>
                  </div>

                  <div>
                      <button class="btn btn-sm btn-light" id="themeBtn">🌙</button>
                      <button class="btn btn-sm btn-danger" id="closeBtn"> ✕</button>
                  </div>
              </div>

              <div class="chat-body" id="chatBody">
                  <div class="message bot">
                      <div class="bubble"> Hello 👋 How can I help you today? </div>
                      <div class="timestamp"> <span id="welcomeTime"></span> </div>
                  </div>

                  <div class="typing" id="typingIndicator">
                      <span></span>
                      <span></span>
                      <span></span>
                  </div>
              </div>

              <div class="card-footer">
                  <div class="input-group">
                      <input type="text" id="messageInput" class="form-control" placeholder="Type your message...">
                      <button class="btn btn-primary" id="sendBtn">Send</button>
                  </div>
              </div>
          </div>
      </div>
  </div>


  <script>
    //
    const chatWindow = document.getElementById("chatWindow");
    const chatToggle = document.getElementById("chatToggle");
    const closeBtn = document.getElementById("closeBtn");
    const sendBtn = document.getElementById("sendBtn");
    const chatBody = document.getElementById("chatBody");
    const typingIndicator = document.getElementById("typingIndicator");
    const input = document.getElementById("messageInput");
    const themeBtn = document.getElementById("themeBtn");
    document.getElementById("welcomeTime").innerText = getTimestamp();

    /* Open Chat */
    chatToggle.addEventListener("click", () => {
        chatWindow.classList.toggle("show");
    });

    /* Close Chat */
    closeBtn.addEventListener("click", () => {
        chatWindow.classList.remove("show");
    });

    /* Dark Mode */
    themeBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");
        themeBtn.innerHTML =
            document.body.classList.contains("dark-mode")
            ? "☀️"
            : "🌙";
    });

    //
    function getTimestamp(){
        return new Date().toLocaleTimeString([],{
            hour:"2-digit",
            minute:"2-digit"
        });
    }

    //
    function addMessage(text,type){
        const div = document.createElement("div");
        div.className = `message ${type}`;
        div.innerHTML = `
            <div class="bubble"> ${text} </div>
            <div class="timestamp"> ${getTimestamp()} </div>
          `;

        chatBody.insertBefore(div, typingIndicator);
        chatBody.scrollTop =
        chatBody.scrollHeight;
    }
    //
    function sendMessage(){
        let message = input.value.trim();
        if(!message) return;

        addMessage(message,"user");
        input.value = "";
        typingIndicator.classList.add("active");

        //get faqs
        let faqs = [
            { question: "hi", answer: "Hello! How can I assist you today?" },
            { question: "hello", answer: "Hello! How can I assist you today?" },
            { question: "help", answer: "Sure! What do you need help with?" },
            { question: "time", answer: "The current time is " + new Date().toLocaleTimeString() },
            { question: "where", answer: "We are located at EIT, Taradale campus." },
            { question: "thank", answer: "You're welcome! If you have any more questions, feel free to ask." },
            { question: "bye", answer: "Goodbye! Have a great day." },
            {
                question: "Why do I have to pay a service fee?",
                answer : "A service fee is only charged for repairs to devices that are no longer under war-ran-ty. Business customers are not charged a service fee in accord with the terms of their con-tract."
            },
            
            {
                question: "What is the bond for?",
                answer : "The bond is to cover any damage done to the courtesy phone and/or charger. The bond will be refunded upon the safe and undamaged return of the phone and charger."
            },
            
            {
                question: "Do I need a charger with my courtesy phone?",
                answer : "No, a charger is optional. You can add one with the 'Add charger' button. If you don't want one but added one by accident, you can remove it by clicking on the 'Remove charger' button."
            },

            {
                question: " Why isn't my phone under warranty?",
                answer : " The length of your phone's warranty depends on the warranty package you chose upon purchase. The standard is 24 months and is calculated from its purchase date."
            },

            {
                question: " How long will my repair take?",
                answer : " Depends on your phone broken status. It takes normally 5 to 7 working days."
            },

            {
                question: " How do you protect the private information in my phone?",
                answer : " We comply with all relevant laws regarding privacy and client confidentiality."
            },

            {
                question: " Where do you get your replacement parts?",
                answer : " We will send you a quote of all possible vendors who supply replacement parts for your references and your choice."
            },

            {
                question: " What happens if my phone is further damage after leaving it with you?",
                answer : " We make sure that it never happens."
            },

            {
                question: " What kind of warranty do you offer and what does it cover?",
                answer : "1 month is the average warranty period. These warranties covers parts and service only."
            },

            {
                question: " What does the repair estimate include?",
                answer : " The repair price estimate includes both replacement parts and labor."
            }  
        ];

        //form the answer
        let botResponse = "";   
        for (let faq of faqs) {
            if (faq.question.toLowerCase().includes(message.toLowerCase()) 
                || faq.answer.toLowerCase().includes(message.toLowerCase())) {
                botResponse += faq.answer;
               //addMessage(faq.answer, "bot");
               //typingIndicator.classList.remove("active");
               //return;
            }             
        }
        if (botResponse == "") {
            botResponse = "I'm sorry, I didn't understand that. Can you please rephrase?";
        }
        addMessage(botResponse, "bot");
        typingIndicator.classList.remove("active");


        /*
        //form the answer
        let botResponse ="";
        if (message.toLowerCase().includes("hi") || message.toLowerCase().includes("hello")) {
            botResponse = "Hello! How can I assist you today?";
        } else if (message.toLowerCase().includes("help")) {
        botResponse = "Sure! What do you need help with?";
        } else if (message.toLowerCase().includes("time")) {
        let currentTime = new Date().toLocaleTimeString();
        botResponse = "The current time is " + currentTime;
        } else if (message.toLowerCase().includes("where")) {
        botResponse = "We are located at EIT, Taradale campus.";
        } else if (message.toLowerCase().includes("thank")) {
        botResponse = "You're welcome! If you have any more questions, feel free to ask.";
        } else if (message.toLowerCase().includes("bye")) {
        botResponse = "Goodbye! Have a great day.";
        }
        else {
        botResponse = "I'm sorry, I didn't understand that. Can you please rephrase?";
        }
  

        setTimeout(()=>{
            typingIndicator.classList.remove("active");
            addMessage("Thank you for your message. A support agent will respond shortly.", "bot");
        },1500);
        */
    }

    //
    sendBtn.addEventListener("click", sendMessage);

    //
    input.addEventListener("keypress", function(e) {
            if(e.key==="Enter"){
                sendMessage();
            }
        }
    );

  </script>

</body>
</html>
